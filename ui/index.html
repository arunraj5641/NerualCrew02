<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CSV → Kafka → Neo4j Chatbot</title>
<style>
  :root { --border:#d8dce2; --accent:#2563eb; --bg:#f7f8fa; --ok:#16a34a; --bad:#dc2626; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin:0; background:var(--bg); color:#1a1d23; }
  header { background:#111827; color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; display:flex; flex-direction:column; gap:20px; }
  section { background:#fff; border:1px solid var(--border); border-radius:10px; padding:18px 20px; }
  section h2 { margin:0 0 12px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:#555; }
  .dropzone { border:2px dashed var(--border); border-radius:8px; padding:28px; text-align:center; cursor:pointer; }
  .dropzone.drag { border-color: var(--accent); background:#eef3ff; }
  button { background:var(--accent); color:#fff; border:0; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:disabled { background:#9ca3af; cursor:not-allowed; }
  progress { width:100%; height:14px; border-radius:6px; overflow:hidden; }
  .row-counts { font-size:13px; color:#444; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th, td { border:1px solid var(--border); padding:6px 8px; text-align:left; }
  th { background:#f1f3f6; }
  .chat-log { display:flex; flex-direction:column; gap:10px; max-height:320px; overflow-y:auto; margin-bottom:12px; }
  .msg { padding:10px 12px; border-radius:8px; font-size:14px; max-width:85%; }
  .msg.user { background:#e5e7eb; align-self:flex-end; }
  .msg.bot { background:#eef3ff; align-self:flex-start; }
  .msg.ungrounded { background:#fef2f2; border:1px solid #fecaca; }
  .meta { font-size:11px; color:#666; margin-top:6px; font-family: ui-monospace, monospace; white-space:pre-wrap; }
  .chat-input { display:flex; gap:8px; }
  .chat-input input { flex:1; padding:9px 10px; border:1px solid var(--border); border-radius:6px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.ok { background:#dcfce7; color:var(--ok); }
  .badge.bad { background:#fee2e2; color:var(--bad); }
  #healthLine { font-size:12px; color:#666; }
</style>
</head>
<body>
<header>
  <h1>CSV → Kafka → Neo4j Chatbot</h1>
  <div id="healthLine">checking health…</div>
</header>
<main>

  <section>
    <h2>1. Upload a CSV</h2>
    <div class="dropzone" id="dropzone">
      <p>Drag a CSV here, or click to browse</p>
      <input type="file" id="fileInput" accept=".csv" style="display:none" />
    </div>
    <div id="uploadResult"></div>
  </section>

  <section id="statusSection" style="display:none">
    <h2>2. Load progress</h2>
    <progress id="progressBar" value="0" max="100"></progress>
    <div class="row-counts" id="rowCounts"></div>
  </section>

  <section id="previewSection" style="display:none">
    <h2>3. Preview (first rows received)</h2>
    <div id="previewTableWrap"></div>
  </section>

  <section>
    <h2>4. Ask a question</h2>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="e.g. How many rows are there?" />
      <button id="chatSend">Ask</button>
    </div>
  </section>

</main>

<script>
const API_BASE = window.API_BASE_URL || "http://localhost:8000";

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const uploadResult = document.getElementById('uploadResult');
const statusSection = document.getElementById('statusSection');
const progressBar = document.getElementById('progressBar');
const rowCounts = document.getElementById('rowCounts');
const previewSection = document.getElementById('previewSection');
const previewTableWrap = document.getElementById('previewTableWrap');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const healthLine = document.getElementById('healthLine');

let currentJobId = null;
let pollTimer = null;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

async function handleFile(file) {
  uploadResult.textContent = "Uploading…";
  previewFromFile(file); // client-side preview of what was actually selected
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch(`${API_BASE}/ingest`, { method: 'POST', body: formData });
    const body = await res.json();
    if (!res.ok) {
      uploadResult.innerHTML = `<span class="badge bad">Rejected</span> ${body.detail || 'Upload failed'}`;
      return;
    }
    currentJobId = body.job_id;
    uploadResult.innerHTML = `<span class="badge ok">Queued</span> job_id=${body.job_id}, rows_received=${body.rows_received}`;
    statusSection.style.display = 'block';
    startPolling();
  } catch (err) {
    uploadResult.innerHTML = `<span class="badge bad">Error</span> ${err}`;
  }
}

function previewFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const lines = String(reader.result).split(/\r?\n/).filter(l => l.trim().length).slice(0, 11);
    if (lines.length === 0) return;
    const rows = lines.map(l => l.split(','));
    let html = '<table><thead><tr>' + rows[0].map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
    for (const r of rows.slice(1)) {
      html += '<tr>' + r.map(c => `<td>${c ?? ''}</td>`).join('') + '</tr>';
    }
    html += '</tbody></table>';
    previewTableWrap.innerHTML = html;
    previewSection.style.display = 'block';
  };
  reader.readAsText(file);
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollStatus, 1000);
  pollStatus();
}

async function pollStatus() {
  if (!currentJobId) return;
  try {
    const res = await fetch(`${API_BASE}/status?job_id=${currentJobId}`);
    const s = await res.json();
    const done = s.rows_loaded + s.rows_failed;
    const pct = s.rows_total ? Math.round((done / s.rows_total) * 100) : 0;
    progressBar.value = pct;
    rowCounts.textContent =
      `status=${s.status} · loaded=${s.rows_loaded} · failed=${s.rows_failed} · total=${s.rows_total} (${pct}%)`;
    if (s.status === 'complete' || s.status === 'failed') {
      clearInterval(pollTimer);
    }
  } catch (err) {
    rowCounts.textContent = 'status check failed: ' + err;
  }
}

function addMessage(text, cls, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendChat() {
  const question = chatInput.value.trim();
  if (!question) return;
  addMessage(question, 'user');
  chatInput.value = '';
  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const body = await res.json();
    const cls = body.grounded ? 'bot' : 'bot ungrounded';
    const meta = `grounded=${body.grounded}\ncypher: ${body.cypher || '(none)'}\nresult: ${JSON.stringify(body.result)}`;
    addMessage(body.answer, cls, meta);
  } catch (err) {
    addMessage('Request failed: ' + err, 'bot ungrounded');
  }
}

chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

async function pollHealth() {
  try {
    const res = await fetch(`${API_BASE}/health`);
    const h = await res.json();
    healthLine.textContent =
      `health: ${h.status} · kafka_connected=${h.kafka_connected} · neo4j_connected=${h.neo4j_connected}`;
  } catch (err) {
    healthLine.textContent = 'health: unreachable';
  }
}
pollHealth();
setInterval(pollHealth, 4000);
</script>
</body>
</html>
