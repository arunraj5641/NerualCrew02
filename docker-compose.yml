version: "3.9"

services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: csv_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "csvkafkaneo4jcluster"
    healthcheck:
      # Broker-side readiness check: can we list topics? This only
      # succeeds once the single broker has actually elected itself
      # leader (handout 2.5 / 6.3), not merely "the process started".
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  neo4j:
    image: neo4j:5.24-community
    container_name: csv_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-csvgraphdb}"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
    healthcheck:
      # cypher-shell round trip, not just "port open" -- catches the
      # "Bolt accepts connections before Neo4j is really ready" trap
      # named in handout 6.3.
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-csvgraphdb} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./api
    container_name: csv_api
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-csvgraphdb}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    # api's own /health additionally does a live canary check (see
    # app/neo4j_client.py) -- this compose-level dependency just
    # guarantees the container isn't even started before both
    # dependencies are healthy.

  loader:
    build: ./loader
    container_name: csv_loader
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-csvgraphdb}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      API_BASE_URL: "http://api:8000"
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      api:
        condition: service_started

  ui:
    build: ./ui
    container_name: csv_ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  neo4j_data:
